<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Factory · Configuración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/logo-escudo.png">
  <link rel="apple-touch-icon" href="img/logo-escudo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-page">
  <header class="topbar">
    <div class="brand brand-sm">
      <img class="brand-logo" src="img/logo-escudo.png" alt="" width="42" height="46">
      <p class="brand-name">App Factory</p>
    </div>
    <div class="topbar-derecha">
      <a href="app.html" class="btn btn-fantasma">← Categorías</a>
    </div>
  </header>

  <main class="contenido">
    <section id="vista-cargando" class="cargando" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Cargando…</p>
    </section>

    <section id="vista-config" hidden>
      <div class="cabecera-categoria">
        <span id="cat-icono" class="categoria-icono" aria-hidden="true"></span>
        <div>
          <h1 id="cat-nombre"></h1>
          <p class="sub">Configuración de la categoría</p>
        </div>
      </div>

      <section id="vista-proximamente" class="tarjeta vacio-config" hidden>
        <p class="emoji-grande" aria-hidden="true">⚙️</p>
        <p>Las especificaciones de esta categoría se definirán pronto.</p>
      </section>

      <section id="vista-espec" hidden>
        <div id="tarjetas-config" class="grid-config"></div>
        <a id="ir-categoria" class="btn btn-primario btn-nuevo" href="#"></a>
      </section>
    </section>
  </main>

  <footer class="pie">
    <img src="img/powered-by.webp" alt="Powered by App Factory" width="220" height="47" loading="lazy">
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/aviso-carga.js"></script>
  <script type="module" src="js/configuracion.js"></script>
</body>
</html>
