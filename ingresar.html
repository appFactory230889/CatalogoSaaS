<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Factory Catalog · Catálogo</title>
  <meta name="description" content="Crea el catálogo de tu negocio y compártelo con tus clientas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/logo-catalogo.png">
  <link rel="apple-touch-icon" href="img/icono-apple.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1E2F5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AF Catalog">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <img class="brand-logo" src="img/logo-catalogo.png" alt="" width="46" height="46">
      <div>
        <p class="brand-name">App Factory<span class="brand-sub">Catalog</span></p>
        <p class="brand-tag">Tu tienda en un link</p>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-modo="login" role="tab" aria-selected="true">Ingresar</button>
      <button type="button" class="tab" data-modo="registro" role="tab" aria-selected="false">Crear cuenta</button>
    </div>

    <form id="form-auth" novalidate>
      <label class="campo">
        <span>Correo electrónico</span>
        <input id="email" type="email" inputmode="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
      </label>

      <label class="campo">
        <span>Contraseña</span>
        <input id="password" type="password" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="current-password" required>
      </label>

      <label class="campo" id="campo-confirmar" hidden>
        <span>Confirmar contraseña</span>
        <input id="password2" type="password" minlength="6" placeholder="Repite tu contraseña" autocomplete="new-password">
      </label>

      <button type="button" id="btn-olvide" class="enlace">¿Olvidaste tu contraseña?</button>

      <p id="mensaje" class="mensaje" role="alert"></p>

      <button type="submit" id="btn-submit" class="btn btn-primario">Ingresar</button>
    </form>

    <div class="separador"><span>o</span></div>

    <button type="button" id="btn-google" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
      </svg>
      Continuar con Google
    </button>
  </main>

  <p class="volver-inicio"><a href="./">← Conoce App Factory Catalog</a></p>

  <footer class="pie">
    <img src="img/powered-by.webp" alt="Powered by App Factory" width="220" height="47" loading="lazy">
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
