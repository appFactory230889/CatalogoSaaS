<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Factory Catalog · Categoría</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/logo-catalogo.png">
  <link rel="apple-touch-icon" href="img/logo-catalogo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-page">
  <header class="topbar">
    <div class="brand brand-sm">
      <img class="brand-logo" src="img/logo-catalogo.png" alt="" width="46" height="46">
      <p class="brand-name">App Factory<span class="brand-sub">Catalog</span></p>
    </div>
    <div class="topbar-derecha">
      <a href="app.html" class="btn btn-fantasma">← Categorías</a>
    </div>
  </header>

  <main class="contenido">
    <section id="vista-cargando" class="cargando" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Cargando…</p>
    </section>

    <section id="vista-categoria" hidden>
      <div class="cabecera-publica">
        <div class="cabecera-categoria">
          <span id="cat-icono" class="categoria-icono" aria-hidden="true"></span>
          <div>
            <h1 id="cat-nombre"></h1>
            <p class="sub" id="cat-conteo"></p>
          </div>
        </div>
        <div class="acciones-compartir">
          <a id="btn-ver-categoria" class="btn btn-fantasma" target="_blank" rel="noopener">Ver como clienta</a>
          <button type="button" id="btn-compartir-categoria" class="btn btn-compartir"></button>
        </div>
      </div>

      <div id="uso" class="uso">
        <div class="uso-fila">
          <span id="uso-texto"></span>
        </div>
        <div class="uso-pista"><div id="uso-barra" class="uso-barra"></div></div>
        <div class="uso-aviso">
          <p class="uso-aviso-texto"></p>
          <a class="btn btn-whatsapp" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>
            Ampliar mi plan por WhatsApp
          </a>
        </div>
      </div>

      <button type="button" id="btn-nuevo" class="btn btn-primario btn-nuevo">＋ Agregar producto</button>

      <!-- Formulario para subir producto -->
      <section id="form-producto" class="tarjeta form-producto" hidden>
        <h2 id="titulo-form">Nuevo producto</h2>

        <label class="selector-foto" id="selector-foto">
          <input type="file" id="input-foto" accept="image/*" hidden>
          <canvas id="lienzo" class="lienzo" hidden></canvas>
          <img id="foto-actual" class="lienzo" alt="" hidden>
          <span id="selector-texto" class="selector-texto">
            <span class="selector-icono" aria-hidden="true">🖼️</span>
            Toca para elegir una foto de tu galería
          </span>
        </label>
        <p class="ayuda" id="ayuda-foto">El código <strong id="codigo-preview">—</strong> se coloca sobre la foto y así se guarda.</p>

        <!-- Categorías sin presentaciones: un solo precio -->
        <div id="bloque-precio-simple">
          <label class="campo">
            <span>Precio (US$)</span>
            <input id="precio" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
          </label>
          <div class="especificaciones">
            <span>Especificaciones</span>
            <p>Las especificaciones de esta categoría se agregarán pronto.</p>
          </div>
        </div>

        <!-- Categorías con especificaciones: presentaciones (tela, color…) con precio por talla -->
        <div id="bloque-presentaciones" hidden>
          <div id="bloque-atributos" class="grid-atributos"></div>
          <h3 class="subtitulo" id="titulo-presentaciones"></h3>
          <p class="sub"><span id="ayuda-presentaciones"></span>
            <a id="link-config" href="#"></a></p>
          <div id="chips-telas" class="chips"></div>
          <div id="presentaciones"></div>
        </div>

        <p id="msg-producto" class="mensaje" role="alert"></p>

        <div class="acciones">
          <button type="button" id="btn-cancelar" class="btn btn-fantasma">Cancelar</button>
          <button type="button" id="btn-guardar" class="btn btn-primario">Guardar producto</button>
        </div>
      </section>

      <div id="lista-vacia" class="vacio" hidden>
        <p class="emoji-grande" aria-hidden="true">📦</p>
        <p>Aún no tienes productos en esta categoría.</p>
      </div>
      <div id="grid-productos" class="grid-productos"></div>
    </section>
  </main>

  <footer class="pie">
    <img src="img/powered-by.webp" alt="Powered by App Factory" width="220" height="47" loading="lazy">
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/aviso-carga.js"></script>
  <script type="module" src="js/categoria.js"></script>
</body>
</html>
